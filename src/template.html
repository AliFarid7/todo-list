<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="container">
        <div class="dashboard">
            <button class="inboxBtn">
                <img src="./imgs/inbox.svg" alt="Inbox Icon">
                <span>Inbox</span>
            </button>
            <h2>My Projects</h2>
            <div id="projectsList"></div>
            <button id="openProjectModalBtn" class="add-project-btn">+ New Project</button>
        </div>

        <dialog id="projectDialog">
            <form id="projectForm">
                <h2>New Project</h2>

                <div class="form-group">
                    <label for="projectName">Project Name:</label>
                    <input type="text" id="projectName" required>
                </div>

                <div class="form-group">
                    <label>Tag Color:</label>
                    <div class="color-options-container">
                        <label class="color-option">
                            <input type="radio" name="projectColor" value="#3b82f6" checked>
                            <span class="color-swatch" style="background-color: #3b82f6;"></span>
                        </label>
                        <label class="color-option">
                            <input type="radio" name="projectColor" value="#ef4444">
                            <span class="color-swatch" style="background-color: #ef4444;"></span>
                        </label>
                        <label class="color-option">
                            <input type="radio" name="projectColor" value="#10b981">
                            <span class="color-swatch" style="background-color: #10b981;"></span>
                        </label>
                        <label class="color-option">
                            <input type="radio" name="projectColor" value="#f59e0b">
                            <span class="color-swatch" style="background-color: #f59e0b;"></span>
                        </label>
                        <label class="color-option">
                            <input type="radio" name="projectColor" value="#8b5cf6">
                            <span class="color-swatch" style="background-color: #8b5cf6;"></span>
                        </label>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="addProjectModalButton">Add Project</button>
                    <button type="button" id="closeProjectModalBtn">Cancel</button>
                </div>
            </form>
        </dialog>

        <div class="main-content">
            <button id="add-new-todo">+ Add Task</button>
            <dialog id="todoDialog">
                <form id="todoForm">
                    <h2>New Todo</h2>

                    <div class="form-group">
                        <label for="title">Title:</label>
                        <input type="text" id="title" required>
                    </div>

                    <div class="form-group">
                        <label for="description">Description: <span class="optional-text">(optional)</span></label>
                        <textarea id="description"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="dueDate">Due Date: <span class="optional-text">(optional)</span></label>
                        <input type="date" id="dueDate" max="2099-12-31">
                    </div>

                    <div class="form-group">
                        <label for="priority">Priority:</label>
                        <select id="priority">
                            <option value="High">High</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <label for="projectSelect">Project:</label>
                        <select id="projectSelect" name="projectSelect">
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="saveTodoBtn">Save Task</button>
                        <button type="button" id="closeDialogBtn">Cancel</button>
                    </div>
                </form>
            </dialog>

            <div class="todoDisplay"></div>
        </div>
    </div>
</body>

</html>
