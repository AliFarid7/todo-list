<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div id="container">
        <div class="dashboard">
            <button class="inbox-button">
                <img src="./imgs/inbox.svg" alt="Inbox Icon">
                <span>Inbox</span>
            </button>
            <h2>My Projects</h2>
            <div id="projectsList"></div>
            <button id="openProjectModalBtn" class="add-project-btn">+ Add Project</button>
        </div>

        <dialog id="projectDialog">
            <form id="projectForm">
                <h2>New Project</h2>

                <div class="form-group">
                    <label for="projectName">Project Name:</label>
                    <input type="text" id="projectName" required">
                </div>

                <div class="form-group">
                    <label for="projectColor">Tag Color:</label>
                    <select id="projectColor">
                        <option value="#3b82f6">🔵 Blue</option>
                        <option value="#ef4444">🔴 Red</option>
                        <option value="#10b981">🟢 Green</option>
                        <option value="#f59e0b">🟡 Yellow</option>
                        <option value="#8b5cf6">🟣 Purple</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit">Add Project</button>
                    <button type="button" id="closeProjectModalBtn">Cancel</button>
                </div>
            </form>
        </dialog>

        <div class="main-content">
            <button id="add-new-todo">+ Add Task</button>
            <dialog id="todoDialog">
                <form id="todoForm">
                    <h2>New Todo</h2>

                    <div class="form-group">
                        <label for="title">Title:</label>
                        <input type="text" id="title" required>
                    </div>

                    <div class="form-group">
                        <label for="description">Description(Optional):</label>
                        <textarea id="description"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="dueDate">Due Date:</label>
                        <input type="date" id="dueDate" max="2099-12-31">
                    </div>

                    <div class="form-group">
                        <label for="priority">Priority:</label>
                        <select id="priority">
                            <option value="High">High</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <label for="projectSelect">Project:</label>
                        <select id="projectSelect" name="projectSelect">
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="submit" id="saveTodoBtn">Save Task</button>
                        <button type="button" id="closeDialogBtn">Cancel</button>
                    </div>
                </form>
            </dialog>

            <div class="todoDisplay"></div>
        </div>
    </div>
</body>

</html>
